name: Validate RAM-aware agents

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile benchmarks/v2/harness/*.py benchmarks/v3/harness/*.py hooks/codex-ram-guard/*.py scripts/generate_profiles.py
